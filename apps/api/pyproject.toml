[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    \.git
  | venv
  | \.venv
  | __pycache__
  | alembic
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
